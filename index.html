<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NHL Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── Metallic gray palette ── */
  --bg:#28292c;
  --surface:#35383d;
  --surface2:#2e3135;
  --surface3:#292b2f;
  --border:#46494f;
  --border2:#585c65;
  --text:#e6eaf0;
  --muted:#9097a8;
  --muted2:#62697a;
  --blue:#6aabdf;
  --blue-lt:rgba(106,171,223,.15);
  --blue-glow:rgba(106,171,223,.3);
  --win:#2ecc71;
  --win-bg:rgba(46,204,113,.12);
  --win-border:rgba(46,204,113,.28);
  --loss:#e74c3c;
  --loss-bg:rgba(231,76,60,.12);
  --loss-border:rgba(231,76,60,.28);
  --yt:#ff3333;
  --yt-bg:rgba(255,50,50,.1);
  --yt-border:rgba(255,50,50,.28);
  --gold:#f0b429;
  --radius:16px;
  --shadow:0 2px 14px rgba(0,0,0,.35);
  --shadow-md:0 8px 32px rgba(0,0,0,.45);
}

html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}

/* ── METALLIC BACKGROUND — mimics brushed hockey puck metal ── */
body{
  background:
    radial-gradient(ellipse 150% 80% at 50% -5%, rgba(160,165,175,.1) 0%, transparent 50%),
    radial-gradient(ellipse 100% 100% at 50% 50%, #32353a 0%, #1e2023 100%);
  background-attachment:fixed;
}
/* subtle horizontal brushed-metal lines */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(
    180deg,
    rgba(255,255,255,.018) 0px, rgba(255,255,255,.018) 1px,
    transparent 1px, transparent 3px
  );
}
/* vignette darkening the edges like a puck */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 90% 90% at 50% 50%,
    transparent 45%, rgba(0,0,0,.5) 100%);
}

/* ── STICKY TOP — header + strip as one unit, zero gap ── */
.top-bar{position:sticky;top:0;z-index:100;background:var(--surface);
  box-shadow:0 2px 10px rgba(15,28,46,.09);}
/* ── HEADER — compact for mobile ── */
.header{
  text-align:center;padding:14px 16px 12px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
.header-title{display:flex;align-items:center;justify-content:center;gap:12px}
.nhl-logo{width:56px;height:56px;flex-shrink:0;border-radius:50%;overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.1);
  cursor:pointer;transition:transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
.nhl-logo:active{transform:scale(.92)}
.header h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(36px,8vw,56px);
  letter-spacing:6px;line-height:1;color:var(--text);
}
.header h1 span{color:var(--blue)}
.header p{color:var(--muted);font-size:10px;letter-spacing:2.5px;text-transform:uppercase;margin-top:5px}

/* ── TEAM STRIP — horizontal scroll ── */
.teams-wrap{
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
.strip-label{
  font-size:9px;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--muted2);padding:8px 16px 0;font-weight:600;
}
.teams-strip{
  display:flex;flex-direction:row;
  overflow-x:auto;overflow-y:hidden;
  gap:6px;padding:8px 16px 10px;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none; /* Firefox */
}
.teams-strip::-webkit-scrollbar{display:none}

/* Fade edges to hint scrollability */
.teams-wrap{position:relative}
.teams-wrap::before,.teams-wrap::after{
  content:'';position:absolute;top:0;bottom:0;width:20px;pointer-events:none;z-index:2;
}
.teams-wrap::before{left:0;background:linear-gradient(to right,var(--surface),transparent)}
.teams-wrap::after{right:0;background:linear-gradient(to left,var(--surface),transparent)}

.team-btn{
  flex:0 0 auto;
  background:var(--surface2);
  border:1.5px solid var(--border);
  border-radius:12px;
  padding:8px 10px 6px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;
  transition:all .16s ease;
  position:relative;overflow:hidden;
  min-width:68px;
  -webkit-tap-highlight-color:transparent;
}
.team-btn::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2.5px;
  background:var(--tc,var(--blue));transform:scaleX(0);
  transition:transform .18s;transform-origin:center;
  border-radius:2px 2px 0 0;
}
.team-btn:active{transform:scale(.94)}
.team-btn.active{
  background:var(--blue-lt);
  border-color:var(--tc,var(--blue));
  box-shadow:0 2px 10px -2px var(--blue-glow);
}
.team-btn.active::after{transform:scaleX(1);background:var(--tc,var(--blue))}
.team-btn img{
  width:44px;height:44px;object-fit:contain;
  transition:transform .16s;
}
.team-btn.active img{transform:scale(1.08)}
.team-btn span{
  font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:1.5px;
  color:var(--muted);transition:color .16s;white-space:nowrap;
}
.team-btn.active span{color:var(--tc,var(--blue))}

/* ── DETAIL AREA ── */
.detail-wrap{padding:14px 12px 60px;max-width:680px;margin:0 auto}

.detail-panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px 16px;
  position:relative;overflow:hidden;
  animation:fadeUp .25s ease;
  box-shadow:var(--shadow-md);
}
.detail-panel::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--tc,var(--blue)) 0%,transparent 70%);
}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Team header inside panel */
.detail-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.detail-head img{width:60px;height:60px;object-fit:contain;flex-shrink:0}
.detail-head .ti h2{
  font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2.5px;line-height:1.05;color:var(--text)
}
.detail-head .ti p{color:var(--muted);font-size:10px;letter-spacing:2.5px;text-transform:uppercase;margin-top:5px;font-weight:500}
.detail-head .ti p span{
  color:var(--tc,var(--blue));background:var(--blue-lt);
  padding:1px 7px;border-radius:4px;border:1px solid var(--blue-glow);
  margin-left:5px;font-size:9px;
}

/* ── GAME CARDS — always stacked ── */
.games-grid{display:flex;flex-direction:column;gap:12px}

.game-card{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  flex:1;
}
.game-tag{
  display:flex;align-items:center;gap:6px;
  font-size:9px;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--muted);margin-bottom:14px;font-weight:700;
}
.game-tag .dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}

/* ── VS ROW ── */
.vs-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.vs-row img{width:42px;height:42px;object-fit:contain;flex-shrink:0}
.vs-row .opp{flex:1;min-width:0}
.vs-row .opp h3{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1.5px;color:var(--text);line-height:1}
.vs-row .opp p{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ha-tag{font-size:9px;padding:2px 8px;border-radius:5px;letter-spacing:1px;text-transform:uppercase;font-weight:700;flex-shrink:0}
.ha-home{background:rgba(26,110,245,.1);color:var(--blue);border:1px solid rgba(26,110,245,.25)}
.ha-away{background:rgba(180,83,9,.08);color:var(--gold);border:1px solid rgba(180,83,9,.2)}

/* ── SCORE ── */
.score-block{
  display:flex;align-items:center;
  background:var(--surface3);border:1px solid var(--border2);
  border-radius:10px;padding:12px 14px;margin-bottom:12px;
  position:relative;overflow:hidden;
}
.score-block.wb::before,.score-block.lb::before{content:'';position:absolute;inset:0}
.score-block.wb::before{background:linear-gradient(135deg,var(--win-bg) 0%,transparent 55%)}
.score-block.lb::before{background:linear-gradient(135deg,var(--loss-bg) 0%,transparent 55%)}
.sc-team{display:flex;flex-direction:column;align-items:center;flex:1;position:relative}
.sc-team img{width:28px;height:28px;object-fit:contain;margin-bottom:3px}
.sc-team .ab{font-size:9px;letter-spacing:1.5px;color:var(--muted);font-family:'Bebas Neue',sans-serif}
.sc-num{font-family:'Bebas Neue',sans-serif;font-size:42px;line-height:1;position:relative}
.sc-num.w{color:var(--win)}.sc-num.l{color:var(--loss)}.sc-num.tie{color:var(--muted)}
.sc-sep{display:flex;flex-direction:column;align-items:center;padding:0 8px;position:relative}
.sc-sep span{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--muted2);line-height:1}
.sc-per{font-size:8px;letter-spacing:1.5px;color:var(--muted2);text-transform:uppercase;margin-top:3px;text-align:center;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:5px;
  font-size:9px;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:10px;}
.chip.w{background:var(--win-bg);color:var(--win);border:1px solid var(--win-border)}
.chip.l{background:var(--loss-bg);color:var(--loss);border:1px solid var(--loss-border)}

/* ── INFO ROWS ── */
.divider{border:none;border-top:1px solid var(--border);margin:12px 0}
.info-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:7px}
.info-row:last-child{margin-bottom:0}
.info-row strong{color:var(--text);font-weight:500}

/* ── HIGHLIGHT BUTTON ── */
.yt-btn{
  display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;margin-top:14px;
  background:var(--yt-bg);border:1.5px solid var(--yt-border);border-radius:11px;
  color:var(--yt);font-size:13px;font-weight:600;text-decoration:none;
  transition:all .15s;font-family:'DM Sans',sans-serif;position:relative;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
.yt-btn::before{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(204,0,0,.07),transparent);opacity:0;transition:opacity .2s}
.yt-btn:hover::before,.yt-btn:active::before{opacity:1}
.yt-btn:active{transform:scale(.98)}
.yt-btn.searching{animation:ytp 1.5s ease-in-out infinite}
@keyframes ytp{0%,100%{opacity:.6}50%{opacity:1}}
.yi{flex-shrink:0;width:22px;height:22px;background:#cc0000;border-radius:5px;display:flex;align-items:center;justify-content:center}
.yt{flex:1;text-align:left;line-height:1.2}
.yt small{display:block;font-size:10px;color:var(--muted);font-weight:400;margin-top:1px}
.yb{background:rgba(204,0,0,.1);border:1px solid rgba(204,0,0,.2);border-radius:4px;
  padding:2px 6px;font-size:9px;font-weight:700;color:var(--yt);letter-spacing:.5px;flex-shrink:0}

/* ── HIGHLIGHT PREVIEW CARD ── */
#ytBox{margin-top:14px}
.yt-dbg{margin-top:8px;font-size:10px;color:var(--muted);line-height:1.5;word-break:break-word}
.yt-dbg summary{cursor:pointer}
#ytBox .yt-btn{margin-top:0}
.yt-card{border:1.5px solid var(--yt-border);border-radius:11px;overflow:hidden;background:var(--yt-bg)}
.yt-thumb{position:relative;aspect-ratio:16/9;background:#000;cursor:pointer}
.yt-thumb img,.yt-thumb iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.yt-play{position:absolute;left:50%;top:50%;width:54px;height:38px;margin:-19px 0 0 -27px;
  background:#cc0000;border-radius:10px;display:flex;align-items:center;justify-content:center;
  transition:transform .15s;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.yt-thumb:hover .yt-play{transform:scale(1.1)}
.yt-thumb.playing{cursor:default}
.yt-meta{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.yt-title{font-size:12px;font-weight:600;line-height:1.35;color:var(--text)}
.yt-open{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
  color:var(--yt);text-decoration:none}
.yt-open:hover{text-decoration:underline}
.sub-link{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;padding:9px 14px;margin-top:7px;
  background:transparent;border:1px solid var(--border2);border-radius:10px;
  color:var(--muted);font-size:12px;font-weight:500;text-decoration:none;
  transition:all .15s;font-family:'DM Sans',sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.sub-link:hover,.sub-link:active{background:var(--surface3);color:var(--text)}

/* ── LIVE BADGE ── */
.live-badge{
  display:inline-flex;align-items:center;gap:5px;background:var(--win-bg);
  border:1px solid var(--win-border);border-radius:6px;padding:3px 9px;
  font-size:9px;letter-spacing:2px;color:var(--win);font-weight:700;
  margin-bottom:12px;text-transform:uppercase;
}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--win);
  animation:lp 1s ease-in-out infinite;display:inline-block}
@keyframes lp{0%,100%{opacity:.3}50%{opacity:1}}

/* ── LOADER ── */
.loader{text-align:center;padding:44px 20px}
.loader-spinner{width:28px;height:28px;border:2px solid var(--border2);
  border-top-color:var(--blue);border-radius:50%;
  animation:spin .7s linear infinite;margin:0 auto 14px}
.loader h3{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;
  color:var(--text);margin-bottom:5px}
.loader p{color:var(--muted);font-size:10px;letter-spacing:2px;text-transform:uppercase}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── ERROR / MISC ── */
.error-box{background:var(--loss-bg);border:1px solid var(--loss-border);
  border-radius:10px;padding:14px 16px;margin-top:12px}
.error-box p{color:var(--loss);font-size:13px;line-height:1.6}
.no-game{color:var(--muted);font-size:12px;padding:6px 0;line-height:1.7}
.hidden{display:none}
.retry-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;max-width:200px;padding:10px 18px;margin:14px auto 0;
  background:var(--blue-lt);border:1.5px solid var(--blue);
  border-radius:10px;color:var(--blue);font-size:13px;font-weight:600;
  cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;
}
.retry-btn:hover,.retry-btn:active{background:var(--blue);color:#fff}

/* ── NEWS CAROUSEL — big full-width tiles ── */
.news-carousel-wrap{padding:12px 0 20px}
.news-label{font-size:11px;letter-spacing:3px;text-transform:uppercase;
  color:var(--text);font-weight:700;padding:0 12px 10px;opacity:.85;text-align:center}
.news-strip{
  display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;
  padding:0 12px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  /* snap to each card */
  scroll-snap-type:x mandatory;
}
.news-strip::-webkit-scrollbar{display:none}
.news-card{
  flex:0 0 calc(100vw - 40px);max-width:500px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;overflow:hidden;cursor:pointer;text-decoration:none;
  display:flex;flex-direction:column;
  scroll-snap-align:start;
  -webkit-tap-highlight-color:transparent;
  transition:transform .15s;
}
.news-card:active{transform:scale(.98)}
.news-card-img{width:100%;height:180px;object-fit:cover;background:var(--surface2)}
.news-card-body{padding:14px}
.news-card-body h4{font-size:15px;font-weight:600;color:var(--text);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-blurb{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-card-body small{display:block;font-size:10px;color:var(--muted2);margin-top:8px;letter-spacing:.5px}
.news-loading{color:var(--muted);font-size:12px;padding:8px 0}

/* ── LIVE SCORE BLOCK (in Next Game when live) ── */
.live-score-block{display:flex;align-items:center;
  background:var(--surface3);border:1.5px solid var(--win-border);
  border-radius:12px;padding:12px 14px;margin-bottom:12px;position:relative;overflow:hidden}
.live-score-block::before{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--win-bg) 0%,transparent 60%)}
.live-score-block .sc-num{font-family:'Bebas Neue',sans-serif;font-size:42px;
  line-height:1;color:var(--text);position:relative}
.live-period{font-size:9px;letter-spacing:1.5px;color:var(--win);
  text-transform:uppercase;margin-top:3px;text-align:center;white-space:nowrap;font-weight:700}
/* ── RESULTS SECTION ── */
.results-section-label{
  display:flex;align-items:center;gap:10px;
  padding:16px 16px 10px;
}
.results-section-label::before,.results-section-label::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(to right,transparent,rgba(255,255,255,.08));
}
.results-section-label::after{
  background:linear-gradient(to left,transparent,rgba(255,255,255,.08));
}
.results-section-label span{
  font-size:11px;letter-spacing:3px;text-transform:uppercase;
  color:var(--text);font-weight:700;white-space:nowrap;opacity:.85;
  flex-shrink:0;
}

/* Result card — full-width, one per snap */
.result-card{
  flex:0 0 calc(100vw - 56px);max-width:380px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);
  border-radius:12px;padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;
  text-decoration:none;-webkit-tap-highlight-color:transparent;
  scroll-snap-align:start;transition:background .15s;gap:6px;
  min-height:0;
}
.result-card:active{background:rgba(255,255,255,.08)}
.result-card-team{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.result-card-team img{width:30px;height:30px;object-fit:contain;flex-shrink:0}
.result-card-abbr{font-family:'Bebas Neue',sans-serif;font-size:13px;
  letter-spacing:1.5px;color:var(--muted2)}
.result-card-team.right{flex-direction:row-reverse;justify-content:flex-end}
.result-card-score{font-family:'Bebas Neue',sans-serif;font-size:30px;
  line-height:1;min-width:20px;text-align:center;flex-shrink:0}
.result-card-score.w{color:var(--win)}.result-card-score.l{color:var(--loss)}
.result-card-center{display:flex;flex-direction:column;align-items:center;
  padding:0 6px;flex-shrink:0}
.result-card-dash{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--muted2);line-height:1}
.result-card-status{font-size:7px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--muted2);margin-top:1px;white-space:nowrap}
.results-empty{color:var(--muted2);font-size:11px;padding:8px 12px;opacity:.6}

/* ── STANDINGS ── */
.standings-wrap{padding:0 12px 28px}
.standings-conf{margin-bottom:20px}
.standings-conf-title{
  font-size:10px;letter-spacing:3px;text-transform:uppercase;
  color:var(--blue);font-weight:700;padding:0 0 8px;opacity:.9;
}
.standings-table{width:100%;border-collapse:collapse}
.standings-table th{
  font-size:8px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--muted2);font-weight:600;padding:4px 6px;text-align:right;opacity:.6;
}
.standings-table th:first-child{text-align:left}
.standings-table td{
  font-size:12px;color:var(--muted);padding:7px 6px;
  border-top:1px solid rgba(255,255,255,.04);text-align:right;
  vertical-align:middle;
}
.standings-table td:first-child{text-align:left}
.standings-td-team{display:flex;align-items:center;gap:7px}
.standings-table td img{width:22px;height:22px;object-fit:contain;flex-shrink:0}
.standings-team-name{font-size:12px;font-weight:500;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.standings-rank{font-size:9px;color:var(--muted2);width:14px;
  text-align:right;flex-shrink:0;font-family:'Bebas Neue',sans-serif}
.standings-pts{font-weight:700;color:var(--text)}
.standings-table tr.playoff-line td{border-top:1px solid rgba(106,171,223,.3)}

</style>
</head>
<body>

<div class="top-bar">
  <div class="header">
    <div class="header-title">
      <div class="nhl-logo">
        <svg viewBox="0 0 60 70" xmlns="http://www.w3.org/2000/svg" width="56" height="56">
          <defs>
            <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#c8d0dc"/>
              <stop offset="50%" stop-color="#8a9ab0"/>
              <stop offset="100%" stop-color="#4a5568"/>
            </linearGradient>
            <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1a2a4a"/>
              <stop offset="100%" stop-color="#0d1829"/>
            </linearGradient>
          </defs>
          <!-- Outer shield -->
          <path d="M30 2 L56 12 L56 38 C56 54 30 68 30 68 C30 68 4 54 4 38 L4 12 Z"
            fill="url(#shieldGrad)" stroke="#b0bcc8" stroke-width="1"/>
          <!-- Inner shield -->
          <path d="M30 7 L51 16 L51 38 C51 51 30 63 30 63 C30 63 9 51 9 38 L9 16 Z"
            fill="url(#innerGrad)"/>
          <!-- NHL text -->
          <text x="30" y="42" text-anchor="middle" font-family="Arial Black,sans-serif"
            font-size="18" font-weight="900" fill="#c8d4e8" letter-spacing="1">NHL</text>
        </svg>
      </div>
      <h1>NHL <span>TRACKER</span></h1>
    </div>
  </div>
  <div class="teams-wrap">
    <div class="teams-strip" id="teamsGrid"></div>
  </div>
</div>

<div class="detail-wrap">
  <div id="newsCarousel" class="news-carousel-wrap">
    <div class="news-label">NHL TOP STORIES</div>
    <div class="news-strip" id="newsStrip"><div class="news-loading">Loading stories…</div></div>
    <div class="results-section-label"><span>Last 24 Hours · Results</span></div>
    <div class="news-strip" id="resultsStrip" style="padding-bottom:12px"><div class="news-loading">Loading results…</div></div>
    <div class="results-section-label"><span>League Standings</span></div>
    <div id="standingsWrap" class="standings-wrap"><div class="news-loading">Loading standings…</div></div>
  </div>
  <div id="detailPanel" class="hidden"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════
   DATA: ESPN public API — same source powering Google Sports panels
   Direct fetch · CORS-open · No proxy · ~200ms · Full season data
══════════════════════════════════════════════════════════════════ */

const TEAMS = [
  {a:"ANA",c:"Anaheim",      n:"Ducks",          color:"#F47A38"},
  {a:"BOS",c:"Boston",       n:"Bruins",          color:"#FFB81C"},
  {a:"BUF",c:"Buffalo",      n:"Sabres",          color:"#4189c7"},
  {a:"CGY",c:"Calgary",      n:"Flames",          color:"#C8102E"},
  {a:"CAR",c:"Carolina",     n:"Hurricanes",      color:"#CC0000"},
  {a:"CHI",c:"Chicago",      n:"Blackhawks",      color:"#CF0A2C"},
  {a:"COL",c:"Colorado",     n:"Avalanche",       color:"#8B6FAE"},
  {a:"CBJ",c:"Columbus",     n:"Blue Jackets",    color:"#5A8AC6"},
  {a:"DAL",c:"Dallas",       n:"Stars",           color:"#00843D"},
  {a:"DET",c:"Detroit",      n:"Red Wings",       color:"#CE1126"},
  {a:"EDM",c:"Edmonton",     n:"Oilers",          color:"#FF6B35"},
  {a:"FLA",c:"Florida",      n:"Panthers",        color:"#C8102E"},
  {a:"LAK",c:"Los Angeles",  n:"Kings",           color:"#a2a2a5"},
  {a:"MIN",c:"Minnesota",    n:"Wild",            color:"#2E7D32"},
  {a:"MTL",c:"Montréal",     n:"Canadiens",       color:"#AF1E2D"},
  {a:"NSH",c:"Nashville",    n:"Predators",       color:"#FFB81C"},
  {a:"NJD",c:"New Jersey",   n:"Devils",          color:"#CE1126"},
  {a:"NYI",c:"NY Islanders", n:"Islanders",       color:"#FC4C02"},
  {a:"NYR",c:"NY Rangers",   n:"Rangers",         color:"#0054A4"},
  {a:"OTT",c:"Ottawa",       n:"Senators",        color:"#E3141C"},
  {a:"PHI",c:"Philadelphia", n:"Flyers",          color:"#F74902"},
  {a:"PIT",c:"Pittsburgh",   n:"Penguins",        color:"#FCB514"},
  {a:"SJS",c:"San Jose",     n:"Sharks",          color:"#20B2AA"},
  {a:"SEA",c:"Seattle",      n:"Kraken",          color:"#3CBFE0"},
  {a:"STL",c:"St. Louis",    n:"Blues",           color:"#2563EB"},
  {a:"TBL",c:"Tampa Bay",    n:"Lightning",       color:"#5B8FD4"},
  {a:"TOR",c:"Toronto",      n:"Maple Leafs",     color:"#4189c7"},
  {a:"UTA",c:"Utah",         n:"Mammoth",         color:"#4B92DB"},
  {a:"VAN",c:"Vancouver",    n:"Canucks",         color:"#00843D"},
  {a:"VGK",c:"Vegas",        n:"Golden Knights",  color:"#B4975A"},
  {a:"WSH",c:"Washington",   n:"Capitals",        color:"#C8102E"},
  {a:"WPG",c:"Winnipeg",     n:"Jets",            color:"#4B6EAF"},
];

// ESPN uses different abbreviations from NHL (e.g. TB vs TBL, NJ vs NJD).
// We resolve logos correctly by building a two-way map from the API response.
let espnIdMap  = {};   // our NHL abbr → ESPN numeric id
let espnToNHL  = {};   // ESPN abbr    → our NHL abbr

const nhlLogo  = a => `https://assets.nhle.com/logos/nhl/svg/${a}_light.svg`;
const espnLogo = a => `https://a.espncdn.com/i/teamlogos/nhl/500/${(a||'nhl').toLowerCase()}.png`;
function logoFor(espnAbbr) {
  const our = espnToNHL[espnAbbr] || espnAbbr;
  return nhlLogo(our);
}

// Fetch ESPN team list immediately in background — done before user clicks anything
const espnReady = fetch(
  'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/teams?limit=50',
  { signal: AbortSignal.timeout(8000) }
).then(r => r.json()).then(data => {
  for (const { team: e } of data.sports[0].leagues[0].teams) {
    const match = TEAMS.find(t => t.n.toLowerCase() === (e.name||'').toLowerCase())
               || TEAMS.find(t => (e.displayName||'').toLowerCase().includes(t.n.toLowerCase()));
    if (match) {
      espnIdMap[match.a]       = e.id;
      espnToNHL[e.abbreviation] = match.a;
    }
  }
}).catch(e => console.warn('ESPN init:', e.message));

// Score parser — ESPN returns score as string, number, or {value, displayValue}
function parseScore(s) {
  if (s == null) return null;
  if (typeof s === 'number') return s;
  if (typeof s === 'string') { const n = parseInt(s,10); return isNaN(n)?null:n; }
  if (typeof s === 'object') { const v = s.value??parseInt(s.displayValue,10); return isNaN(v)?null:v; }
  return null;
}

// Date formatter — ET for game-night dates (matches NHL titles)
const ET = 'America/New_York';
function fmtDate(s) {
  const d = new Date(s);
  return {
    date:      d.toLocaleDateString('en-US',{timeZone:ET,weekday:'short',month:'short',day:'numeric',year:'numeric'}),
    time:      d.toLocaleTimeString('en-US',{timeZone:ET,hour:'numeric',minute:'2-digit',timeZoneName:'short'}),
    localTime: d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',timeZoneName:'short'}),
  };
}

// ── UI ────────────────────────────────────────────────────────────
const grid  = document.getElementById('teamsGrid');
const panel = document.getElementById('detailPanel');
let loadToken = 0;
let livePoller = null;

// ── Web Audio ─────────────────────────────────────────────────────
let audioCtx = null;

function ensureAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // silent unlock buffer
    const b = audioCtx.createBuffer(1,1,audioCtx.sampleRate);
    const s = audioCtx.createBufferSource();
    s.buffer = b; s.connect(audioCtx.destination); s.start(0);
  } catch(e) {}
}

function playTick() {
  if (!audioCtx) return;
  try {
    const buf  = audioCtx.createBuffer(1, audioCtx.sampleRate*0.06, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i=0;i<data.length;i++)
      data[i] = (Math.random()*2-1)*Math.exp(-i/(audioCtx.sampleRate*0.008));
    const src=audioCtx.createBufferSource(), gain=audioCtx.createGain();
    src.buffer=buf; gain.gain.setValueAtTime(0.18,audioCtx.currentTime);
    src.connect(gain); gain.connect(audioCtx.destination); src.start();
  } catch(e) {}
}

function playScrollTick() {
  if (!audioCtx) return;
  try {
    const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(1100+Math.random()*400, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.07, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.04);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime+0.04);
  } catch(e) {}
}

TEAMS.forEach(t => {
  const btn = document.createElement('button');
  btn.className='team-btn'; btn.id='btn-'+t.a;
  btn.style.setProperty('--tc', t.color);
  btn.innerHTML=`<img src="${nhlLogo(t.a)}" alt="${t.n}" onerror="this.src='${espnLogo(t.a)}'"><span>${t.a}</span>`;
  btn.addEventListener('click', ()=>{ playTick(); selectTeam(t); });
  grid.appendChild(btn);
});

// ── Scroll sound via touchmove (fires DURING active gesture) ──────
// touchstart on the strip → creates AudioContext (running state immediately)
// touchmove → plays tick (still inside gesture, context guaranteed running)
grid.addEventListener('touchstart', e => {
  ensureAudio();
}, { passive: true });

grid.addEventListener('touchmove', (() => {
  let lastX = null, lastTick = 0;
  return e => {
    if (!audioCtx) return;
    const x = e.touches[0].clientX;
    if (lastX === null) { lastX = x; return; }
    const dx = Math.abs(x - lastX);
    const now = Date.now();
    if (dx > 6 && now - lastTick > 80) {
      lastX = x; lastTick = now;
      playScrollTick();
    }
  };
})(), { passive: true });

// ── NHL logo = reset button ────────────────────────────────────────
document.querySelector('.nhl-logo').style.cursor = 'pointer';
document.querySelector('.nhl-logo').addEventListener('click', resetToNews);

function resetToNews() {
  if (livePoller) { clearInterval(livePoller); livePoller=null; }
  ++loadToken;
  document.querySelectorAll('.team-btn').forEach(b=>b.classList.remove('active'));
  panel.className='hidden'; panel.innerHTML='';
  document.getElementById('newsCarousel').classList.remove('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
}

function selectTeam(t) {
  if (livePoller) { clearInterval(livePoller); livePoller=null; }
  document.querySelectorAll('.team-btn').forEach(b=>b.classList.remove('active'));
  const ab=document.getElementById('btn-'+t.a);
  ab.classList.add('active');
  ab.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  document.getElementById('newsCarousel').classList.add('hidden');
  const tok=++loadToken;
  panel.className='detail-panel';
  panel.style.setProperty('--tc',t.color);
  panel.innerHTML=`<div class="loader"><div class="loader-spinner"></div><h3>${t.n}</h3><p id="ls">Connecting to ESPN…</p></div>`;
  setTimeout(()=>{
    const tb=document.querySelector('.top-bar');
    const off=tb?tb.offsetHeight:0;
    window.scrollTo({top:panel.getBoundingClientRect().top+window.scrollY-off-8,behavior:'smooth'});
  },50);
  loadTeam(t,tok);
}

// ── NHL News — to-rss.xyz scrapes NHL.com, ESPN as fallback ──────
(async () => {
  const strip = document.getElementById('newsStrip');

  function parseRSS(xmlText) {
    const xml   = new DOMParser().parseFromString(xmlText, 'text/xml');
    const items = Array.from(xml.querySelectorAll('item')).slice(0, 10);
    if (!items.length) throw new Error('empty');
    return items.map(item => {
      const title   = item.querySelector('title')?.textContent || '';
      const link    = item.querySelector('link')?.textContent?.trim()
                   || item.querySelector('guid')?.textContent?.trim()
                   || 'https://www.nhl.com/news';
      const desc    = item.querySelector('description')?.textContent || '';
      const blurb   = desc.replace(/<[^>]*>/g,'')
                         .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
                         .trim().slice(0, 130);
      const media   = item.querySelector('content[url]')
                   || item.querySelector('enclosure[url]')
                   || item.querySelector('thumbnail');
      const img     = media?.getAttribute('url') || '';
      const pubDate = item.querySelector('pubDate')?.textContent || '';
      const date    = pubDate
        ? new Date(pubDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})
        : '';
      return `<a class="news-card" href="${link}" target="_blank" rel="noopener">
        ${img ? `<img class="news-card-img" src="${img}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}
        <div class="news-card-body">
          <h4>${title}</h4>
          ${blurb ? `<p class="news-blurb">${blurb}</p>` : ''}
          <small>${date}</small>
        </div>
      </a>`;
    }).join('');
  }

  // Race NHL RSS (scraped) vs ESPN simultaneously — first to succeed wins
  const nhlRSS = 'https://www.to-rss.xyz/nhl/';
  const espnNews = fetch(
    'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/news?limit=10',
    { signal: AbortSignal.timeout(6000) }
  ).then(r=>r.json()).then(d=>{
    const articles = d.articles||[];
    if (!articles.length) throw new Error('empty');
    return articles.map(a => {
      const img   = a.images?.[0]?.url||'';
      const title = a.headline||'';
      const blurb = (a.description||'').slice(0,130);
      const date  = a.published ? new Date(a.published).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
      const link  = a.links?.web?.href||'https://www.nhl.com/news';
      return `<a class="news-card" href="${link}" target="_blank" rel="noopener">
        ${img?`<img class="news-card-img" src="${img}" alt="" loading="lazy" onerror="this.style.display='none'">` :''}
        <div class="news-card-body"><h4>${title}</h4>${blurb?`<p class="news-blurb">${blurb}</p>`:''}<small>${date}</small></div>
      </a>`;
    }).join('');
  });

  const nhlRssNews = Promise.any([
    fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(nhlRSS)}`,
      { signal: AbortSignal.timeout(8000) }).then(r=>r.json()).then(d=>parseRSS(d.contents||'')),
    fetch(`https://corsproxy.io/?url=${encodeURIComponent(nhlRSS)}`,
      { signal: AbortSignal.timeout(8000) }).then(r=>{ if(!r.ok) throw 0; return r.text(); }).then(parseRSS),
  ]);

  try {
    strip.innerHTML = await Promise.any([nhlRssNews, espnNews]);
  } catch(e) {
    strip.innerHTML = '<p class="news-loading">Could not load NHL news.</p>';
  }
})();

// ── Last 24hr Results ─────────────────────────────────────────────
function step(m) { const el=document.getElementById('ls'); if(el) el.textContent=m; }
(async () => {
  const wrap = document.getElementById('resultsWrap');
  try {
    // ESPN scoreboard — fetch yesterday and today to cover rolling 24hrs
    const etNow  = new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
    const pad    = n => String(n).padStart(2,'0');
    const toDate = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
    const today  = toDate(etNow);
    const yest   = toDate(new Date(etNow - 86400000));

    const fetchDay = async (dateStr) => {
      const r = await fetch(
        `https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard?dates=${dateStr}`,
        { signal: AbortSignal.timeout(7000) }
      );
      const d = await r.json();
      return d.events || [];
    };

    const [evToday, evYest] = await Promise.all([fetchDay(today), fetchDay(yest)]);
    const cutoff = Date.now() - 24 * 3600 * 1000;

    const allEvents = [...evToday, ...evYest]
      .filter(ev => {
        const comp = ev.competitions?.[0];
        return comp?.status?.type?.completed && new Date(ev.date).getTime() >= cutoff;
      })
      .sort((a,b) => new Date(b.date) - new Date(a.date));

    if (!allEvents.length) {
      document.getElementById('resultsStrip').innerHTML = '<p class="results-empty">No completed games in the last 24 hours.</p>';
      return;
    }

    document.getElementById('resultsStrip').innerHTML = allEvents.map(ev => {
      const comp     = ev.competitions[0];
      const home     = comp.competitors.find(c => c.homeAway === 'home');
      const away     = comp.competitors.find(c => c.homeAway === 'away');
      const homeS    = parseInt(home?.score, 10) || 0;
      const awayS    = parseInt(away?.score, 10) || 0;
      const homeW    = homeS > awayS;
      const status   = comp.status?.type?.shortDetail || comp.status?.type?.description || 'Final';
      const homeAbbr = home?.team?.abbreviation || '';
      const awayAbbr = away?.team?.abbreviation || '';
      const homeLogo = logoFor(homeAbbr) || espnLogo(homeAbbr);
      const awayLogo = logoFor(awayAbbr) || espnLogo(awayAbbr);
      const gameLink = `https://www.espn.com/nhl/game/_/gameId/${ev.id}`;

      return `<a class="result-card" href="${gameLink}" target="_blank" rel="noopener">
        <div class="result-card-team">
          <img src="${awayLogo}" onerror="this.src='${espnLogo(awayAbbr)}'">
          <span class="result-card-abbr">${awayAbbr}</span>
        </div>
        <span class="result-card-score ${!homeW?'w':'l'}">${awayS}</span>
        <div class="result-card-center">
          <span class="result-card-dash">–</span>
          <span class="result-card-status">${status}</span>
        </div>
        <span class="result-card-score ${homeW?'w':'l'}">${homeS}</span>
        <div class="result-card-team right">
          <img src="${homeLogo}" onerror="this.src='${espnLogo(homeAbbr)}'">
          <span class="result-card-abbr">${homeAbbr}</span>
        </div>
      </a>`;
    }).join('');

  } catch(e) {
    document.getElementById('resultsStrip').innerHTML = '<p class="results-empty">Could not load results.</p>';
  }
})();

// ── League Standings — ESPN CORS-open API ────────────────────────
(async () => {
  const wrap = document.getElementById('standingsWrap');
  try {
    // ESPN's v2 standings — same domain as all our other working calls
    const r = await fetch(
      // Season year = year the season ends; NHL starts in October so Oct+ → next calendar year
      `https://site.api.espn.com/apis/v2/sports/hockey/nhl/standings?season=${new Date().getMonth()>=9?new Date().getFullYear()+1:new Date().getFullYear()}&type=0&level=3`,
      { signal: AbortSignal.timeout(8000) }
    );
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();

    // Walk the children tree: league → conferences → divisions → teams
    const groups = [];
    const walk = (node) => {
      if (node.standings?.entries?.length) {
        groups.push({ name: node.name || node.abbreviation || '', entries: node.standings.entries });
      }
      if (node.children) node.children.forEach(walk);
    };
    walk(d);

    if (!groups.length) throw new Error('no groups');

    const getStat = (stats, name) =>
      stats?.find(s => s.name === name || s.shortDisplayName === name)?.displayValue
      ?? stats?.find(s => s.name === name || s.shortDisplayName === name)?.value
      ?? '–';

    wrap.innerHTML = groups.map(g => {
      const rows = g.entries.map((entry, i) => {
        const team  = entry.team;
        const abbr  = team.abbreviation || '';
        const name  = team.shortDisplayName || team.displayName || abbr;
        const stats = entry.stats || [];
        const w   = getStat(stats, 'wins');
        const l   = getStat(stats, 'losses');
        const otl = getStat(stats, 'otLosses') !== '–' ? getStat(stats, 'otLosses') : getStat(stats, 'OTL');
        const pts = getStat(stats, 'points');
        return `<tr class="${i===3?'playoff-line':''}">
          <td><div class="standings-td-team">
            <span class="standings-rank">${i+1}</span>
            <img src="${logoFor(abbr)}" onerror="this.src='${espnLogo(abbr)}'">
            <span class="standings-team-name">${name}</span>
          </div></td>
          <td>${w}</td><td>${l}</td><td>${otl}</td>
          <td class="standings-pts">${pts}</td>
        </tr>`;
      }).join('');
      return `<div class="standings-conf">
        <div class="standings-conf-title">${g.name}</div>
        <table class="standings-table">
          <thead><tr><th>Team</th><th>W</th><th>L</th><th>OTL</th><th>PTS</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    }).join('');

  } catch(e) {
    console.warn('Standings failed:', e.message);
    wrap.innerHTML = '<p class="results-empty">Could not load standings.</p>';
  }
})();

// ── Live score updater ────────────────────────────────────────────
function startLivePoller(teamAbbr, tok) {
  if (livePoller) clearInterval(livePoller);
  livePoller = setInterval(async () => {
    if (tok !== loadToken) { clearInterval(livePoller); return; }
    try {
      const scoreUrl = 'https://api-web.nhle.com/v1/score/now';
      let d;
      try {
        const r = await fetch(scoreUrl, {signal: AbortSignal.timeout(6000)});
        d = await r.json();
      } catch(_) {
        const r2 = await fetch(
          `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(scoreUrl)}`,
          {signal: AbortSignal.timeout(9000)}
        );
        d = await r2.json();
      }
      const liveGame = (d.games||[]).find(g =>
        (g.homeTeam?.abbrev===teamAbbr || g.awayTeam?.abbrev===teamAbbr) &&
        (g.gameState==='LIVE' || g.gameState==='CRIT')
      );
      if (!liveGame) { clearInterval(livePoller); return; }
      const isHome = liveGame.homeTeam?.abbrev === teamAbbr;
      const myS    = (isHome ? liveGame.homeTeam?.score : liveGame.awayTeam?.score) ?? '–';
      const oppS   = (isHome ? liveGame.awayTeam?.score : liveGame.homeTeam?.score) ?? '–';
      const pd     = liveGame.periodDescriptor;
      const pLabel = pd ? (pd.periodType==='OT'?'OT':pd.periodType==='SO'?'SO':`P${pd.number}`) : 'LIVE';
      const clock  = liveGame.clock?.timeRemaining ? ` · ${liveGame.clock.timeRemaining}` : '';
      const detail = pLabel + clock;
      const block  = document.getElementById('liveScoreBlock');
      if (!block) { clearInterval(livePoller); return; }
      block.querySelector('.live-my-score').textContent  = myS;
      block.querySelector('.live-opp-score').textContent = oppS;
      block.querySelector('.live-period').textContent    = detail;
    } catch(e) {}
  }, 30000); // refresh every 30s
}
async function loadTeam(t, tok) {
  try {
    if (tok !== loadToken) return;
    step('Fetching schedule…');

    // Use NHL's own public API.
    // IMPORTANT: /now redirects (307) and Firefox drops CORS on the redirect → use
    // explicit season ID to call the final URL directly with no redirect at all.
    const _yr = new Date().getMonth() >= 9 ? new Date().getFullYear() : new Date().getFullYear() - 1;
    const nhlUrl = `https://api-web.nhle.com/v1/club-schedule-season/${t.a}/${_yr}${_yr+1}`;
    let data;
    try {
      data = await fetchJsonCORS(nhlUrl, j => Array.isArray(j?.games));
    } catch (err) {
      const why = err?.errors ? [...new Set(err.errors.map(x => x?.message || String(x)))].join(' / ') : (err?.message || '');
      const local = location.protocol === 'file:'
        ? ' You opened this page as a local file (file://), which many APIs block. Run a tiny local server instead: open a terminal in this folder, run  python -m http.server 8000  and visit  http://localhost:8000'
        : '';
      throw new Error('NHL schedule unavailable — please try again. [' + why + ']' + local);
    }
    if (tok !== loadToken) return;

    const games = data.games || [];
    const past    = games.filter(g => g.gameState==='OFF' || g.gameState==='FINAL');
    const future  = games.filter(g => g.gameState==='FUT' || g.gameState==='PRE' ||
                                      g.gameState==='LIVE' || g.gameState==='CRIT');
    past.sort((a,b)   => new Date(a.startTimeUTC)-new Date(b.startTimeUTC));
    future.sort((a,b) => new Date(a.startTimeUTC)-new Date(b.startTimeUTC));

    renderPanel(t, past.at(-1)||null, future[0]||null);

    // Start live score polling if next game is currently live
    const nextGame = future[0];
    if (nextGame && (nextGame.gameState==='LIVE' || nextGame.gameState==='CRIT')) {
      startLivePoller(t.a, tok);
    }

    // YouTube lookup — non-blocking, uses NHL abbreviations directly
    const lastGame = past.at(-1);
    if (lastGame) {
      const isHome  = lastGame.homeTeam?.abbrev === t.a;
      const oppAbbr = isHome ? lastGame.awayTeam?.abbrev : lastGame.homeTeam?.abbrev;
      const oppTeam = TEAMS.find(x => x.a === oppAbbr) || {a: oppAbbr, n: oppAbbr};
      findHighlight(t, oppTeam, isHome, new Date(lastGame.startTimeUTC))
        .then(yt => { if (tok === loadToken) renderHighlight(yt); })
        .catch(() => {});
    }

  } catch(e) {
    if (tok !== loadToken) return;
    panel.innerHTML = `
      <div class="detail-head">
        <img src="${nhlLogo(t.a)}" style="width:84px;height:84px;object-fit:contain" onerror="this.src='${espnLogo(t.a)}'">
        <div class="ti"><h2>${t.c} ${t.n}</h2><p>NHL · <span>${t.a}</span></p></div>
      </div>
      <div class="error-box"><p>⚠️ ${e.message}</p></div>
      <button class="retry-btn" onclick="retryTeam('${t.a}')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/></svg>
        Try Again
      </button>`;
  }
}

  const t = TEAMS.find(x => x.a===abbr);
  if (t) selectTeam(t);

// JSON fetch: direct first, then every proxy in parallel (first valid answer wins).
async function fetchJsonCORS(url, validate = () => true) {
  try {
    const r = await fetch(url, {signal: AbortSignal.timeout(7000)});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (validate(j)) return j;
  } catch (e) { console.warn('[fetch] direct failed:', url, e?.message || e); }
  const txt = await fetchViaProxies(url, t => { try { return validate(JSON.parse(t)); } catch { return false; } }, 12000);
  return JSON.parse(txt);
}

// Fetch text through all proxies in parallel; first one whose body passes `validate` wins.
function fetchViaProxies(url, validate, ms = 9000) {
  return Promise.any(CORS_PROXIES.map(mk =>
    fetch(mk(url), {signal: AbortSignal.timeout(ms)})
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(txt => { if (!validate(txt)) throw new Error('bad body'); return txt; })
  ));
}

async function fetchTextCORS(url, validate, ms = 9000) {
  try {
    const r = await fetch(url, {signal: AbortSignal.timeout(6000)});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const t = await r.text();
    if (validate(t)) return t;
    throw new Error('bad body');
  } catch (_) { /* direct blocked (CORS) → proxies */ }
  return fetchViaProxies(url, validate, ms);
}

// ── parsers → [{id,title,channel,pubMs?,ago?}] ──
function parseYtSearchHtml(html) {
  const m = html.match(/var ytInitialData\s*=\s*(\{[\s\S]+?\});\s*<\/script>/);
  if (!m) throw new Error('no ytInitialData');
  const data = JSON.parse(m[1]);
  const out = [];
  (function walk(o) {
    if (!o || typeof o !== 'object') return;
    if (o.videoRenderer) {
      const v = o.videoRenderer;
      out.push({
        id: v.videoId,
        title: (v.title?.runs || []).map(r => r.text).join('') || v.title?.simpleText || '',
        channel: v.ownerText?.runs?.[0]?.text || v.longBylineText?.runs?.[0]?.text || '',
        ago: v.publishedTimeText?.simpleText || '',
      });
      return;
    }
    for (const k in o) walk(o[k]);
  })(data);
  return out;
}

function parseYtRss(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  return [...doc.getElementsByTagName('entry')].map(en => ({
    id: en.getElementsByTagName('yt:videoId')[0]?.textContent
        || (en.querySelector('link')?.getAttribute('href') || '').split('v=')[1] || '',
    title: en.getElementsByTagName('title')[0]?.textContent || '',
    channel: 'NHL',
    pubMs: new Date(en.getElementsByTagName('published')[0]?.textContent || '').getTime(),
  }));
}

// "3 days ago", "Streamed 5 hours ago" → approximate age in ms
function agoToMs(txt) {
  const m = /(\d+)\s*(second|minute|hour|day|week|month|year)/i.exec(txt || '');
  if (!m) return null;
  const U = {second:1e3, minute:6e4, hour:36e5, day:864e5, week:6048e5, month:2592e6, year:31536e6};
  return +m[1] * U[m[2].toLowerCase()];
}

// ── decide whether a candidate is THE highlight clip for this exact game ──
function scoreCandidate(c, ctx) {
  if (!c.id || !c.title) return -1;
  const tl = c.title.toLowerCase();
  const hasNick = n => { n = n.toLowerCase(); const last = n.split(' ').pop();
                         return tl.includes(n) || tl.includes(last); };
  if (!hasNick(ctx.awayNick) || !hasNick(ctx.homeNick)) return -1;
  if (!/highlight|recap/.test(tl)) return -1;
  if (/full game|press conference|post-?game|interview|top \d|best of/.test(tl)) return -1;

  let score = 1;

  // Date check 1 — NHL puts the game date in the title
  const dateInTitle = ctx.dateVariants.some(d => tl.includes(d));
  const nearDate = !dateInTitle && (ctx.nearVariants || []).some(d => tl.includes(d));
  const otherDate = /(january|february|march|april|may|june|july|august|september|october|november|december)\s+\d{1,2}|\b\d{1,2}\/\d{1,2}\/\d{2,4}\b/.test(tl);
  if (dateInTitle) score += 6;
  else if (nearDate) score += 3;
  else if (otherDate) return -1;                    // a different day → an older/newer meeting

  // Date check 2 — publish time
  const age = Date.now() - ctx.gameMs;
  if (c.pubMs) {
    const d = (c.pubMs - ctx.gameMs) / 864e5;
    if (d < -0.5 || d > 4) { if (!dateInTitle && !nearDate) return -1; } else score += 2;
  } else if (c.ago && !dateInTitle && !nearDate) {
    const a = agoToMs(c.ago);
    if (a !== null) {
      // clip is published after the game, so its age is slightly LESS than the game's age
      const tol = Math.max(2 * 864e5, age * 0.3);
      if (Math.abs(a - age) > tol) return -1;
      score += 1;
    }
  }

  if (/nhl highlights/.test(tl)) score += 3;
  if (/sportsnet/i.test(c.channel || '')) score += 4;
  else if (/^nhl$/i.test((c.channel || '').trim())) score += 3;
  else if (/nhl/i.test(c.channel || '')) score += 1;
  return score;
}

async function findHighlight(myTeam, oppTeam, iAmHome, gameDate) {
  const myNick   = YT_NICK[myTeam.a]  || myTeam.n;
  const oppNick  = YT_NICK[oppTeam.a] || oppTeam.n;
  const awayNick = iAmHome ? oppNick : myNick;
  const homeNick = iAmHome ? myNick  : oppNick;

  // ET game-night date ("October 5, 2026" + numeric variants); also ±1 day (clips are sometimes dated the next day)
  const ET = {timeZone:'America/New_York'};
  const variantsFor = off => {
    const d = new Date(gameDate.getTime() + off * 864e5);
    const mo = new Intl.DateTimeFormat('en-US',{...ET, month:'long'}).format(d).toLowerCase();
    const dy = +new Intl.DateTimeFormat('en-US',{...ET, day:'numeric'}).format(d);
    const yr = +new Intl.DateTimeFormat('en-US',{...ET, year:'numeric'}).format(d);
    const mn = +new Intl.DateTimeFormat('en-US',{...ET, month:'numeric'}).format(d);
    const ab = mo.slice(0,3);
    return {
      pretty: `${mo[0].toUpperCase()+mo.slice(1)} ${dy}, ${yr}`,
      list: [`${mo} ${dy}, ${yr}`, `${mo} ${dy} ${yr}`, `${ab} ${dy}, ${yr}`, `${ab}. ${dy}, ${yr}`,
             `${mn}/${dy}/${yr}`, `${mn}/${dy}/${String(yr).slice(2)}`],
    };
  };
  const dateVariants = variantsFor(0).list;
  const nearVariants = [...variantsFor(-1).list, ...variantsFor(1).list];
  const dateStr = variantsFor(0).pretty;

  // Sportsnet's title format: "NHL Highlights | Predators vs. Maple Leafs - October 6, 2026"
  const titleStr  = `NHL Highlights | ${awayNick} vs. ${homeNick} - ${dateStr}`;
  const searchQ   = titleStr;
  const searchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(searchQ)}`;
  const ctx = {awayNick, homeNick, gameMs: gameDate.getTime(), dateVariants, nearVariants};
  const dbg = [];
  const warn = name => e => {
    const why = e?.errors ? [...new Set(e.errors.map(x => x?.message || String(x)))].join(' / ') : (e?.message || String(e));
    console.warn('[highlight]', name, 'failed:', why); dbg.push(name + ': ' + why); throw e; };

  const pick = list => {
    let best = null, bs = 0;
    for (const c of list) { const sc = scoreCandidate(c, ctx); if (sc > bs) { bs = sc; best = c; } }
    if (!best) {
      const ex = list.filter(c => c.title).slice(0, 3).map(c => '“' + c.title.slice(0, 60) + '”').join(', ');
      throw new Error(list.length + ' results, none matched' + (ex ? ' e.g. ' + ex : ''));
    }
    console.info('[highlight] matched:', best.title, best.id);
    return {id: best.id, url: `https://www.youtube.com/watch?v=${best.id}`, direct: true, label: best.title};
  };
  const unesc = t => { const d = document.createElement('textarea'); d.innerHTML = t; return d.value; };

  const sources = [];

  // Source 0 — official YouTube Data API (only if a key is configured). Direct, no proxy.
  if (YT_API_KEY) {
    const after = new Date(gameDate.getTime() - 12 * 36e5).toISOString();
    sources.push(
      fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=15` +
            `&publishedAfter=${encodeURIComponent(after)}&q=${encodeURIComponent(searchQ)}&key=${YT_API_KEY}`,
            {signal: AbortSignal.timeout(8000)})
        .then(r => { if (!r.ok) throw new Error('API HTTP ' + r.status); return r.json(); })
        .then(j => pick((j.items || []).map(i => ({
          id: i.id?.videoId, title: unesc(i.snippet?.title || ''),
          channel: i.snippet?.channelTitle, pubMs: new Date(i.snippet?.publishedAt).getTime()}))))
        .catch(warn('YouTube API')));
  }

  // Source A — Piped search API (open-source YouTube front-end; sends CORS headers)
  sources.push(Promise.any(
    ['https://pipedapi.kavin.rocks', 'https://api.piped.private.coffee', 'https://pipedapi.adminforge.de']
      .map(base => fetch(`${base}/search?q=${encodeURIComponent(searchQ)}&filter=videos`,
                         {signal: AbortSignal.timeout(8000)})
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }))
  ).then(j => pick((j.items || []).map(v => ({
      id: (v.url || '').split('v=')[1], title: v.title, channel: v.uploaderName,
      pubMs: v.uploaded > 0 ? v.uploaded : undefined, ago: v.uploadedDate || ''}))))
   .catch(warn('Piped')));

  // Source B — YouTube search page through CORS proxies (any game date)
  sources.push(fetchViaProxies(
      `${searchUrl}&sp=EgIQAQ%253D%253D&hl=en&gl=US`, t => t.includes('ytInitialData'), 10000)
    .then(html => pick(parseYtSearchHtml(html)))
    .catch(warn('search page')));

  // Source C — channel feeds: Sportsnet (all uploads + long-form only) and NHL.
  // Only the newest ~15 videos per feed, so this catches games from the last day or so.
  const feedUrls = [
    `https://www.youtube.com/feeds/videos.xml?playlist_id=UULF${YT_SN.slice(2)}`,
    `https://www.youtube.com/feeds/videos.xml?channel_id=${YT_SN}`,
    `https://www.youtube.com/feeds/videos.xml?channel_id=${YT_CH}`,
  ];
  sources.push(
    Promise.allSettled(feedUrls.map(u => fetchTextCORS(u, t => t.includes('<entry'), 8000)
        .then(xml => parseYtRss(xml).map(c => ({...c, channel: u.includes(YT_CH) ? 'NHL' : 'Sportsnet'})))))
      .then(rs => {
        const all = rs.filter(r => r.status === 'fulfilled').flatMap(r => r.value);
        if (!all.length) throw new Error('feeds unavailable (' +
          rs.map(r => r.reason?.errors ? [...new Set(r.reason.errors.map(x => x.message))].join('/') : r.reason?.message).join(' | ') + ')');
        return pick(all);
      })
      .catch(warn('channel feeds')));

  // Source D — Invidious search API
  sources.push(Promise.any(
    ['https://inv.nadeko.net', 'https://yewtu.be', 'https://invidious.privacyredirect.com'].map(base =>
      fetch(`${base}/api/v1/search?q=${encodeURIComponent(searchQ)}&type=video`,
            {signal: AbortSignal.timeout(7000)})
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }))
  ).then(arr => pick(arr.map(v => ({id: v.videoId, title: v.title, channel: v.author,
                                    pubMs: (v.published || 0) * 1000}))))
   .catch(warn('Invidious')));

  try {
    return await Promise.any(sources);
  } catch (_) {
    console.warn('[highlight] all sources failed → search-link fallback');
    return {url: searchUrl, direct: false, label: titleStr, debug: dbg};
  }
}

// Render the result in the "Last Game" card: thumbnail + inline player + link

  if (!box) return;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  if (!yt.direct) {
    box.innerHTML = `
      <a class="yt-btn" href="${esc(yt.url)}" target="_blank" rel="noopener">
        <div class="yi">${YT}</div>
        <div class="yt"><span>Search YouTube for highlights</span><small>Clip not found automatically</small></div>
        <span class="yb">SEARCH</span>
      </a>
      <details class="yt-dbg"><summary>Why wasn't it found?</summary>
        <div>${(yt.debug || []).map(esc).join('<br>') || 'No details'}</div>
        <div>Page: ${esc(location.origin)} · Query: ${esc(yt.label)}</div>
      </details>`;
    return;
  }
  const canEmbed = location.protocol !== 'file:';   // YouTube refuses embeds from file:// pages
  box.innerHTML = `
    <div class="yt-card">
      <div class="yt-thumb" id="ytThumb" role="button" tabindex="0" aria-label="Play highlight">
        <img src="https://i.ytimg.com/vi/${yt.id}/hqdefault.jpg" alt="Highlight preview"
             onerror="this.src='https://i.ytimg.com/vi/${yt.id}/mqdefault.jpg'">

      </div>
      <div class="yt-meta">
        <div class="yt-title">${esc(yt.label)}</div>
        <a class="yt-open" href="${esc(yt.url)}" target="_blank" rel="noopener">${YT}<span>Open on YouTube</span></a>
      </div>
    </div>`;
  const thumb = document.getElementById('ytThumb');
  const play = () => {
    if (!canEmbed) { window.open(yt.url, '_blank', 'noopener'); return; }
    thumb.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${yt.id}?autoplay=1&rel=0"
      title="NHL highlight" allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
      allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
    thumb.classList.add('playing');
  };
  thumb.addEventListener('click', play);
  thumb.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(); } });
}

          <img src="${nhlLogo(t.a)}" alt="${t.a}" onerror="this.src='${espnLogo(t.a)}'" style="width:28px;height:28px;object-fit:contain;margin-bottom:3px">
          <div class="sc-num live-my-score">${myS}</div>
          <div class="ab">${t.a}</div>
        </div>
        <div class="sc-sep"><span>–</span><div class="live-period">${detail}</div></div>
        <div class="sc-team">
          <img src="${nhlLogo(oppAbbr)}" alt="${oppAbbr}" onerror="this.src='${espnLogo(oppAbbr)}'" style="width:28px;height:28px;object-fit:contain;margin-bottom:3px">
          <div class="sc-num live-opp-score">${oppS}</div>
          <div class="ab">${oppAbbr}</div>
        </div>
      </div>` : '';

    return `
      ${isLive?`<div class="live-badge"><span class="live-dot"></span>LIVE · ${detail}</div>`:''}
      ${liveScoreHTML}
      <div class="vs-row">
        <img src="${nhlLogo(oppAbbr)}" alt="${oppAbbr}" onerror="this.src='${espnLogo(oppAbbr)}'">
        <div class="opp"><h3>VS ${oppAbbr}</h3><p>${oppName}</p></div>
        <span class="ha-tag ${isHome?'ha-home':'ha-away'}">${isHome?'HOME':'AWAY'}</span>
      </div>
      <hr class="divider">
      <div class="info-row">${CAL}<strong>${date}</strong></div>
      <div class="info-row">${CLK}<strong>${localTime}</strong></div>
      ${venue?`<div class="info-row">${HOM}<strong>${venue}</strong></div>`:''}`;
  })();

  // Last game card
  const lastHTML = (() => {
    if (!last) return `<p class="no-game">No recent game data found.</p>`;
    const isHome  = last.homeTeam?.abbrev === t.a;
    const opp     = isHome ? last.awayTeam : last.homeTeam;
    const oppAbbr = opp?.abbrev || '?';
    const oppTeam = TEAMS.find(x => x.a === oppAbbr);
    const oppName = oppTeam ? `${oppTeam.c} ${oppTeam.n}` : oppAbbr;
    const myS     = isHome ? (last.homeTeam?.score ?? null) : (last.awayTeam?.score ?? null);
    const oppS    = isHome ? (last.awayTeam?.score ?? null) : (last.homeTeam?.score ?? null);
    const hasS    = myS !== null && oppS !== null;
    const won     = hasS && myS > oppS;
    const {date}  = fmtDate(last.startTimeUTC);
    const lastPd  = last.gameOutcome?.lastPeriodType;
    const status  = lastPd==='OT' ? 'Final/OT' : lastPd==='SO' ? 'Final/SO' : 'Final';

    const scoreHTML = hasS ? `
      <div class="score-block ${won?'wb':'lb'}">
        <div class="sc-team">
          <img src="${nhlLogo(t.a)}" alt="${t.a}" onerror="this.src='${espnLogo(t.a)}'">
          <div class="sc-num ${won?'w':'l'}">${myS}</div>
          <div class="ab">${t.a}</div>
        </div>
        <div class="sc-sep"><span>–</span><div class="sc-per">${status}</div></div>
        <div class="sc-team">
          <img src="${nhlLogo(oppAbbr)}" alt="${oppAbbr}" onerror="this.src='${espnLogo(oppAbbr)}'">
          <div class="sc-num">${oppS}</div>
          <div class="ab">${oppAbbr}</div>
        </div>
      </div>
      <div class="chip ${won?'w':'l'}">${won?'✓ WIN':'✗ LOSS'}</div>` : '';

    return `
      <div class="vs-row">
        <img src="${nhlLogo(oppAbbr)}" alt="${oppAbbr}" onerror="this.src='${espnLogo(oppAbbr)}'">
        <div class="opp"><h3>VS ${oppAbbr}</h3><p>${oppName}</p></div>
        <span class="ha-tag ${isHome?'ha-home':'ha-away'}">${isHome?'HOME':'AWAY'}</span>
      </div>
      ${scoreHTML}
      <hr class="divider">
      <div class="info-row">${CAL}<strong>${date}</strong></div>
      <div id="ytBox">
        <div class="yt-btn searching">
          <div class="yi">${YT}</div>
          <div class="yt"><span>Watch on YouTube</span><small>Finding highlight clip…</small></div>
          <span class="yb">LOADING</span>
        </div>
      </div>
      <a href="https://www.nhl.com/gamecenter/${last.id}" target="_blank" rel="noopener" class="sub-link">
        ${TVS} View full recap on NHL.com
      </a>`;
  })();

  panel.innerHTML = `
    <div class="detail-head">
      <img src="${nhlLogo(t.a)}" alt="${t.n}" onerror="this.src='${espnLogo(t.a)}'">
      <div class="ti">
        <h2>${t.c} ${t.n}</h2>
        <p>NHL · <span>${t.a}</span></p>
      </div>
    </div>
    <div class="games-grid">
      <div class="game-card">
        <div class="game-tag"><span class="dot" style="background:var(--muted2)"></span>Last Game</div>
        ${lastHTML}
      </div>
      <div class="game-card">
        <div class="game-tag"><span class="dot" style="background:var(--blue)"></span>Next Game</div>
        ${nextHTML}
      </div>
    </div>`;
}
</script>
</body>
</html>
